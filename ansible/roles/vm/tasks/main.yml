- name: List existing VMs
  ansible.builtin.command: virsh -c {{ vm_libvirt_uri }} list --all --name
  changed_when: false
  register: vm_list

- name: Check whether the VM exists
  ansible.builtin.set_fact:
    vm_exists: "{{ vm_name in vm_list.stdout_lines }}"

- name: Stop the previous VM
  ansible.builtin.command: virsh -c {{ vm_libvirt_uri }} destroy {{ vm_name }}
  changed_when: true
  failed_when: false
  when: vm_exists and vm_rebuild | bool

- name: Remove the previous VM and its disks
  ansible.builtin.command: virsh -c {{ vm_libvirt_uri }} undefine {{ vm_name }} --remove-all-storage --nvram
  changed_when: true
  when: vm_exists and vm_rebuild | bool

- name: Create the VM
  when: not vm_exists or vm_rebuild | bool
  block:
    - name: Create a thin OS disk on top of the base image
      ansible.builtin.command: >-
        qemu-img create -f qcow2 -b {{ vm_base_image }} -F qcow2
        {{ vm_image_dir }}/{{ vm_name }}.qcow2 {{ vm_disk_size }}
      changed_when: true

    # --boot uefi: under the default legacy BIOS, Debian 13's kernel reboot-loops right after GRUB
    - name: Install the VM
      ansible.builtin.command: >-
        virt-install --connect {{ vm_libvirt_uri }}
        --name {{ vm_name }} --memory {{ vm_memory }} --vcpus {{ vm_vcpus }} --import
        --disk path={{ vm_image_dir }}/{{ vm_name }}.qcow2
        --os-variant debian12 --network network=default --graphics none --boot uefi
        --cloud-init user-data={{ role_path }}/files/user-data.yaml --noautoconsole
      changed_when: true

- name: Wait for the VM to get a DHCP lease
  ansible.builtin.command: virsh -c {{ vm_libvirt_uri }} domifaddr {{ vm_name }}
  changed_when: false
  register: vm_addr
  until: vm_addr.stdout is search('ipv4\s+[0-9.]+/')
  retries: 60
  delay: 2

- name: Point the inventory at the VM
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/inventory.ini"
    content: |
      # Generated by the vm role
      [server]
      {{ vm_name }} ansible_host={{ vm_addr.stdout | regex_search('ipv4\s+([0-9.]+)/', '\1') | first }} ansible_user=cube
    mode: "0644"
  become: false
