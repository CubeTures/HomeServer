k3s_channel: stable
k3s_version: ""

flux_version: ""
flux_github_owner: CubeTures
flux_github_repo: home-server
flux_branch: main
flux_path: k8s/clusters/home
# flux_github_token # all.sops.yml

flate_version: "0.6.5"

vm_name: k3s
vm_rebuild: false
