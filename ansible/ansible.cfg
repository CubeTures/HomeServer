[defaults]
nocows = 1
inventory = inventory.ini
roles_path = roles
host_key_checking = False # the test VM gets rebuilt often, so its host key keeps changing
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
pipelining = True

[community.sops]
binary = ../sops/sops.sh
