# Only reachable over Tailscale, so everyone gets full access without logging in
http:
  port: 8080
server:
  cacheDir: /home/filebrowser/cache
  sources:
    # A source named "files" breaks URLs two folders deep (gtsteffaniak/filebrowser#3143)
    - path: /srv/files
      name: shared
      config:
        defaultEnabled: true
    - path: /srv/media
      name: media
      config:
        defaultEnabled: true
        readOnly: true
auth:
  methods:
    noauth: true
userDefaults:
  listing:
    showHidden: true
  preview:
    image: true
    popup: true
    video: true
    audio: true
    office: true
    highQuality: true
