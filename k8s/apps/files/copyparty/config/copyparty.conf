# Only reachable over Tailscale, so everyone gets full access without logging in

[global]
  e2dsa  # index files for search
  e2ts   # index media tags
  hist: /state/hist  # keep indexes and thumbnails out of the shared folders
  see-dots  # show dotfiles by default instead of only after toggling them in settings
  dotsrch   # include dotfiles in search results

# The `.` permission is what allows dotfiles to be listed at all
[/files]
  /w/files
  accs:
    rwmd.: *

[/media]
  /w/media
  accs:
    r.: *
