apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: copyparty
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: copyparty
          image: copyparty/ac:1.20.26
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # /cfg is a read-only ConfigMap, so runtime state goes on the PVC
            - name: XDG_CONFIG_HOME
              value: /state
          ports:
            - containerPort: 3923
          volumeMounts:
            - name: config
              mountPath: /cfg
            - name: state
              mountPath: /state
            - name: files
              mountPath: /w/files
            - name: media
              mountPath: /w/media
              readOnly: true
          readinessProbe:
            httpGet:
              # The /._ suffix keeps probes out of the logs
              path: /?reset=/._
              port: 3923
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: copyparty-config
        - name: state
          persistentVolumeClaim:
            claimName: copyparty-state
        - name: files
          persistentVolumeClaim:
            claimName: files-data
        - name: media
          hostPath:
            path: /data/media
            type: DirectoryOrCreate
