apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  annotations:
    # Tailscale operator gives this Service its own tailnet device.
    tailscale.com/expose: "true"
    tailscale.com/hostname: homepage
spec:
  type: NodePort
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
