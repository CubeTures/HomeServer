apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.5.0
          env:
            # Required by Homepage; tighten to <node-ip>:30000 once there's a stable hostname.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          envFrom:
            - secretRef:
                name: homepage-secrets
          ports:
            - containerPort: 3000
          volumeMounts:
            # mount individually because homepage writes other files to /app/config
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config
              mountPath: /app/config/custom.css
              subPath: custom.css
            - name: config
              mountPath: /app/config/custom.js
              subPath: custom.js
            - name: config
              mountPath: /app/public/images/background.jpg
              subPath: background.jpg
            - name: icons
              mountPath: /app/public/icons
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: icons
          configMap:
            name: homepage-icons
        - name: logs
          emptyDir: {}
