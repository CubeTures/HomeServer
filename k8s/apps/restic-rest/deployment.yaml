apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-rest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: restic-rest
  template:
    metadata:
      labels:
        app: restic-rest
    spec:
      containers:
        - name: restic-rest
          image: restic/rest-server:0.14.0
          env:
            - name: DISABLE_AUTHENTICATION
              value: "true"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: restic-server-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 1Gi
      volumes:
        - name: restic-server-data
          persistentVolumeClaim:
            claimName: restic-server-data
