# Throwaway test app: proves the cluster + Flux pipeline works end to end.
apiVersion: v1
kind: Namespace
metadata:
  name: whoami
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami
spec:
  type: NodePort # exposed on <node-ip>:30080, no ingress needed
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
