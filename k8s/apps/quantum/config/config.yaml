http:
  port: 8080
server:
  cacheDir: /home/filebrowser/cache
  sources:
    - path: /srv/media
      name: media
      config:
        defaultEnabled: true
    - path: /srv/data
      name: data
      config:
        defaultEnabled: true
        readOnly: true
        # Shown in the writable media source instead
        rules:
          - folderPath: /media
auth:
  methods:
    noauth: true
userDefaults:
  listing:
    showHidden: true
  preview:
    image: true
    popup: true
    video: true
    audio: true
    office: true
    highQuality: true
