http:
  port: 8080
server:
  cacheDir: /home/filebrowser/cache
  sources:
    - path: /srv/data
      name: data
      config:
        defaultEnabled: true
        readOnly: true
        rules:
          - folderPath: /media
    - path: /srv/media
      name: media
      config:
        defaultEnabled: true
auth:
  methods:
    noauth: true
userDefaults:
  sidebar:
    sticky: false
  listing:
    showHidden: true
    singleClick: true
  preview:
    image: true
    popup: true
    video: true
    audio: true
    office: true
    highQuality: true
