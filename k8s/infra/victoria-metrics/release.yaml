apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.96.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: vm
    # k3s runs these inside its single binary on localhost, so they can't be scraped
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    alertmanager:
      enabled: false
    vmalert:
      enabled: false
    vmsingle:
      spec:
        retentionPeriod: 30d
        storage:
          storageClassName: local-path
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 14d
        storage:
          storageClassName: local-path
    vlagent:
      enabled: true
    grafana:
      plugins:
        - victoriametrics-logs-datasource
      service:
        type: NodePort
        nodePort: 30300
