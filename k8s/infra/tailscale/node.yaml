apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node
spec:
  selector:
    matchLabels:
      app: tailscale-node
  template:
    metadata:
      labels:
        app: tailscale-node
    spec:
      hostNetwork: true
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.104.1
          env:
            - name: TS_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: client_secret
            - name: TS_AUTHKEY
              value: "$(TS_OAUTH_CLIENT_SECRET)?ephemeral=false&preauthorized=true"
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:home
            - name: TS_HOSTNAME
              value: home
            - name: TS_USERSPACE
              value: "false"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
          securityContext:
            privileged: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: state
          hostPath:
            path: /var/lib/tailscale-k3s
            type: DirectoryOrCreate
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
