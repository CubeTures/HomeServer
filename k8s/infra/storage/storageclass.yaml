# Root path from k3s default-local-storage-path
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-data
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  allowUnsafePathPattern: "true"
  pathPattern: "apps/{{ .PVC.Namespace }}/{{ .PVC.Name }}"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-db
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  allowUnsafePathPattern: "true"
  pathPattern: "dbs/{{ .PVC.Namespace }}/{{ .PVC.Name }}"
